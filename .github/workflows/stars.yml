# Recounts the stars behind the "stars on my repos" badge once a day and commits badges/stars.json when the number
# changes. shields.io reads that file through its endpoint badge.
name: stars

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stars
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Count stars
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/count_stars.py
      - name: Commit the badge if it changed
        run: |
          if git diff --quiet -- badges/stars.json; then
            echo "unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/stars.json
          git commit -m "Update the stars badge"
          git push
